  <div class="t" data-page-node-id="UAzZrDvDGb9FzsoLpDPG4B">正在打开门店业绩工作台…</div>
  <div class="s" id="tip" data-page-node-id="HslGAvnBfgJOHuqK5Enlds">正在获取最新版本</div>
  <div class="bar" data-page-node-id="ythfNrUg5nVJ4lZymDCa1W"><i data-page-node-id="22GNSIqnTbmiZSCmVcnBiR"></i></div>
</div>
<script>
/* 永远进入最新版本：先拉 version.json 拿最新版本号，再跳转到 index.html?...&v=<最新>
   —— 跳转目标每次都不同，浏览器/CDN 缓存里不可能有，因此必定加载最新版。
   保留 room / diag 等原有参数；3 秒拿不到版本号也直接进，绝不卡住。 */
(function () {
  var params = new URLSearchParams(location.search);
  if (!params.get('room')) params.set('room', 'shop_mendian');
  params.delete('v');
  var target = 'index.html?' + params.toString();

  function go(ver) {
    var tip = document.getElementById('tip');
    if (tip) tip.textContent = '正在进入…';
    location.replace(target + (ver ? '&v=' + encodeURIComponent(ver) : ''));
  }

  var done = false;
  var timer = setTimeout(function () { if (!done) { done = true; go(''); } }, 3000);
  fetch('version.json?_=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (done) return; done = true; clearTimeout(timer); go((j && j.ver) || ''); })
    .catch(function () { if (done) return; done = true; clearTimeout(timer); go(''); });
})();
</script>
</body>
</html>
